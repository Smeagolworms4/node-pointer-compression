name: Docker Hub README

# Copies README.md to the description of the Docker Hub repository, on every change of the README.
# The build workflows also do it after publishing tags, which covers the first publication.

on:
  push:
    branches: [main]
    paths: [README.md, tools/dockerhub-readme.sh, .github/workflows/dockerhub-readme.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readme:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      IMAGE: ${{ vars.IMAGE || 'smeagolworms4/node-pointer-compression' }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - run: tools/dockerhub-readme.sh
