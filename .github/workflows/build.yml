name: Build

# Every day: lists the latest release of each maintained Node.js line (tools/versions.mjs), and builds the ones not
# yet on Docker Hub — Node.js compiled from source with V8 pointer compression, on Alpine, for linux/amd64 and
# linux/arm64, each on a native runner (no emulation). Every image is smoke-tested before it is pushed.
#
# Manual run: `version` builds one version (24.21.0) or the latest of one line (24), published or not;
# `force` rebuilds what is already published; `push` unticked builds and tests without publishing.

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Node.js version (24.21.0) or line (24) to build; empty: every missing version'
        required: false
        default: ''
      force:
        description: 'Rebuild versions already published'
        type: boolean
        default: false
      push:
        description: 'Push the images to Docker Hub'
        type: boolean
        default: true

# One run at a time: two runs would build and tag the same versions.
concurrency:
  group: build
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Docker Hub repository (owner/name); repository variable IMAGE overrides it.
  IMAGE: ${{ vars.IMAGE || 'smeagolworms4/node-pointer-compression' }}
  PUSH: ${{ github.event_name == 'schedule' || inputs.push }}

jobs:
  detect:
    name: Versions to build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
      any: ${{ steps.versions.outputs.any }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Maintained Node.js lines not yet published
        id: versions
        env:
          ONLY: ${{ inputs.version }}
          FORCE: ${{ inputs.force }}
        run: |
          matrix="$(node tools/versions.mjs)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "any=$(jq '.include | length > 0' <<< "$matrix")" >> "$GITHUB_OUTPUT"
          { echo '### Versions to build'; jq -r '.include[] | "- Node.js \(.version) → `\(.tags)`"' <<< "$matrix"; } >> "$GITHUB_STEP_SUMMARY"
          jq -e '.include | length > 0' <<< "$matrix" > /dev/null || echo 'Nothing to build: every maintained line is published.' >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Node.js ${{ matrix.node.version }} ${{ matrix.platform.arch }}
    needs: detect
    if: needs.detect.outputs.any == 'true'
    runs-on: ${{ matrix.platform.runner }}
    # Compiling Node.js takes one to three hours on a 4-core runner; 360 minutes is the limit of hosted runners.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(needs.detect.outputs.matrix).include }}
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    env:
      VERSION: ${{ matrix.node.version }}
      ARCH: ${{ matrix.platform.arch }}
    steps:
      - uses: actions/checkout@v7

      - name: Build (full, then slim from the same compilation)
        run: |
          docker build --build-arg "NODE_VERSION=$VERSION" --target full -t "$IMAGE:$VERSION-alpine-$ARCH" .
          docker build --build-arg "NODE_VERSION=$VERSION" --target slim -t "$IMAGE:$VERSION-alpine-slim-$ARCH" .
          docker images "$IMAGE" --format '{{.Tag}}  {{.Size}}' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Smoke tests
        run: |
          for tag in "$VERSION-alpine-$ARCH" "$VERSION-alpine-slim-$ARCH"; do
            docker run --rm -v "$PWD/test:/test:ro" "$IMAGE:$tag" node /test/smoke.mjs "$VERSION"
          done
          # entrypoint and user, as in the official image
          test "$(docker run --rm "$IMAGE:$VERSION-alpine-slim-$ARCH" -p '1+1')" = 2
          test "$(docker run --rm --user node "$IMAGE:$VERSION-alpine-slim-$ARCH" id -u)" = 1000

      # A native addon shipped as a Node-API prebuilt binary must load as is on this build.
      - name: Native addon (Node-API prebuild)
        run: |
          docker run --rm "$IMAGE:$VERSION-alpine-$ARCH" sh -ec '
            mkdir /tmp/addon && cd /tmp/addon && npm init -y > /dev/null
            npm install --no-audit --no-fund better-sqlite3 > /dev/null
            node -e "const D = require(\"better-sqlite3\"); console.log(\"better-sqlite3, SQLite\", new D(\":memory:\").prepare(\"select sqlite_version() v\").get().v)"'

      - uses: docker/login-action@v4
        if: env.PUSH == 'true'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push the per-architecture images
        if: env.PUSH == 'true'
        run: |
          docker push "$IMAGE:$VERSION-alpine-$ARCH"
          docker push "$IMAGE:$VERSION-alpine-slim-$ARCH"

  publish:
    name: Tags of Node.js ${{ matrix.node.version }}
    needs: [detect, build]
    # also when one version failed: the others are still published
    if: always() && needs.detect.outputs.any == 'true' && (github.event_name == 'schedule' || inputs.push)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(needs.detect.outputs.matrix).include }}
    env:
      VERSION: ${{ matrix.node.version }}
      TAGS: ${{ matrix.node.tags }}
      LATEST: ${{ matrix.node.latest }}
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # A version is tagged only when both architectures were built, tested and pushed.
      - name: Multi-architecture tags
        run: |
          for variant in alpine alpine-slim; do
            sources=()
            for arch in amd64 arm64; do
              docker buildx imagetools inspect "$IMAGE:$VERSION-$variant-$arch" > /dev/null
              sources+=("$IMAGE:$VERSION-$variant-$arch")
            done
            tags=()
            for prefix in $TAGS; do tags+=(-t "$IMAGE:$prefix-$variant"); done
            if [ "$LATEST" = true ]; then
              tags+=(-t "$IMAGE:$variant")
              if [ "$variant" = alpine ]; then tags+=(-t "$IMAGE:latest"); else tags+=(-t "$IMAGE:slim"); fi
            fi
            docker buildx imagetools create "${tags[@]}" "${sources[@]}"
            echo "- $variant: ${tags[*]//-t /}" >> "$GITHUB_STEP_SUMMARY"
          done
